<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <title>Messi vs Ronaldo Live Vote</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app">

        <!-- =========================
             MAIN SCOREBOARD
        ========================== -->

        <section
            class="scoreboard"
            aria-label="Messi vs Ronaldo Scoreboard"
        >

            <!-- =====================
                 MESSI SIDE
            ====================== -->

            <button
                id="messiSide"
                class="player-side messi-side"
                type="button"
                aria-label="Vote for Messi"
            >

                <div class="player-content">

                    <!-- Crown -->
                    <div
                        id="messiCrown"
                        class="crown"
                        aria-hidden="true"
                    >
                        👑
                    </div>

                    <!-- Name -->
                    <div class="player-name">
                        MESSI
                    </div>

                    <!-- Score -->
                    <div
                        id="messiScore"
                        class="score"
                    >
                        00
                    </div>

                </div>

            </button>


            <!-- =====================
                 RONALDO SIDE
            ====================== -->

            <button
                id="ronaldoSide"
                class="player-side ronaldo-side"
                type="button"
                aria-label="Vote for Ronaldo"
            >

                <div class="player-content">

                    <!-- Crown -->
                    <div
                        id="ronaldoCrown"
                        class="crown"
                        aria-hidden="true"
                    >
                        👑
                    </div>

                    <!-- Name -->
                    <div class="player-name">
                        RONALDO
                    </div>

                    <!-- Score -->
                    <div
                        id="ronaldoScore"
                        class="score"
                    >
                        00
                    </div>

                </div>

            </button>


            <!-- CENTER LINE -->

            <div
                class="center-line"
                aria-hidden="true"
            ></div>

        </section>


        <!-- =========================
             RESET CONTROL
        ========================== -->

        <button
            id="resetBtn"
            class="reset-button"
            type="button"
        >
            RESET
        </button>

    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
