<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>GOAT ARENA LIVE</title>

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section
            id="scoreboard"
            class="scoreboard"
            aria-label="Messi vs Ronaldo Live Scoreboard"
        >

            <!-- =========================
                 MESSI SIDE
            ========================== -->

            <button
                id="messiSide"
                class="player-side messi-side"
                type="button"
                aria-label="Vote for Messi"
            >

                <div class="player-content">

                    <div
                        id="messiCrown"
                        class="crown"
                        aria-hidden="true"
                    >👑</div>

                    <div class="player-name">
                        MESSI
                    </div>

                    <div
                        id="messiScore"
                        class="score"
                    >00</div>

                </div>

            </button>


            <!-- =========================
                 RONALDO SIDE
            ========================== -->

            <button
                id="ronaldoSide"
                class="player-side ronaldo-side"
                type="button"
                aria-label="Vote for Ronaldo"
            >

                <div class="player-content">

                    <div
                        id="ronaldoCrown"
                        class="crown"
                        aria-hidden="true"
                    >👑</div>

                    <div class="player-name">
                        RONALDO
                    </div>

                    <div
                        id="ronaldoScore"
                        class="score"
                    >00</div>

                </div>

            </button>


            <!-- =========================
                 CENTER DIVIDER
            ========================== -->

            <div
                class="center-line"
                aria-hidden="true"
            ></div>


            <!-- =========================
                 CHANNEL BRAND
            ========================== -->

            <div
                class="brand-area"
                aria-label="GOAT ARENA LIVE"
            >

                <!-- YouTube Channel DP -->
                <img
                    id="channelLogo"
                    class="channel-logo"
                    src="logo.png"
                    alt="GOAT ARENA LIVE"
                >


                <!-- Channel Name -->
                <div class="channel-brand">
                    GOAT ARENA LIVE
                </div>


                <!-- Round Reset -->
                <button
                    id="resetBtn"
                    class="reset-button"
                    type="button"
                    aria-label="Reset scores"
                >
                    RESET
                </button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
